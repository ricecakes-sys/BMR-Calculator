<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMR & Calorie Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bmr-calculator">
    <h2>BMR & Daily Calorie Calculator</h2>
    <div class="controls">
      <form>
        <div class="gender-section">
          <label><input type="radio" name="gender" value="male" checked> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
        </div>

        <div class="age-section">
          <label for="age">Age</label>
          <input type="number" id="age" placeholder="Age">
        </div>

        <div class="height-section">
          <label for="height">Height (cm)</label>
          <input type="number" id="height" placeholder="Height (cm)">
        </div>

        <div class="weight-section">
          <label for="weight">Weight (kg)</label>
          <input type="number" id="weight" placeholder="Weight (kg)">
        </div>

        <div class="activity-section">
          <label for="activity">Activity Level</label>
          <select id="activity">
            <option value="1.2">Sedentary (little or no exercise)</option>
            <option value="1.375">Lightly Active (exercise 1-3 days/week)</option>
            <option value="1.55">Moderately Active (exercise 3-5 days/week)</option>
            <option value="1.725">Very Active (exercise 6-7 days/week)</option>
            <option value="1.9">Extra Active (hard exercise/physical job)</option>
          </select>
        </div>
      </form>
    </div>

    <div class="result">
      <button type="button" class="calculate-btn">Calculate</button>
      <div class="error-msg">Please enter valid values.</div>
      <div class="result-msg">
        <p>Your BMR: <span class="calories">0</span> kcal/day</p>
        <p>Total Daily Calories (TDEE): <span class="tdee-calories">0</span> kcal/day</p>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
